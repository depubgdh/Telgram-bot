<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<style>
:root{
  --bg:#070B1A; --card:rgba(19,26,52,.72); --ink:#EAF0FF; --mute:#93A0C4; --line:rgba(140,160,255,.14);
  --teal:#1B2E8F; --teal2:#7FA2FF; --gold:#F5B000; --gold-ink:#2E2000;
  --pos:#3ED598; --neg:#FF7B66; --field:rgba(255,255,255,.06); --r:16px;
  --glass:rgba(22,28,60,.62); --glass-line:rgba(160,175,255,.18); --tab-on:#9DB6FF; --tab-bg:rgba(110,130,255,.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#070B1A;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:0 16px calc(110px + env(safe-area-inset-bottom));min-height:100vh;
  background:radial-gradient(120% 55% at 0% 0%,rgba(37,76,214,.55),transparent 62%),
    radial-gradient(90% 50% at 100% 12%,rgba(124,58,237,.42),transparent 60%),
    radial-gradient(110% 45% at 50% 100%,rgba(20,60,160,.45),transparent 65%),
    linear-gradient(180deg,#070B1A,#0A0820 55%,#060914);background-attachment:fixed}
h2{font-size:18px;margin:22px 0 10px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.hero{margin:14px 0 12px;background:url(/static/hero.svg) center/cover no-repeat,#2A1470;color:#F2F5FF;box-shadow:0 12px 34px rgba(60,60,220,.32);border-radius:22px;padding:20px 18px 16px;position:relative;overflow:hidden}
.hero small{opacity:.75;font-size:13px}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-.5px;margin:2px 0 14px}
.hero .big span{font-size:16px;font-weight:600;opacity:.8;margin-left:6px}
.coins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.coin{background:rgba(255,255,255,.1);border-radius:12px;padding:9px 10px;min-width:0}
.coin b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis}
.coin i{font-style:normal;font-size:12px;opacity:.75}
.banner{margin-top:12px;background:#FFF3D6;color:var(--gold-ink);border-radius:12px;padding:10px 12px;font-size:14px}

.card{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mute{color:var(--mute);font-size:14px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.hist .row{padding:10px 0;border-bottom:1px solid var(--line)}
.hist .row:last-child{border:0}
.empty{text-align:center;color:var(--mute);padding:26px 10px}

nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;
  display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px;border-radius:32px;
  background:var(--glass);border:1px solid var(--glass-line);box-shadow:0 10px 32px rgba(0,0,0,.22);
  -webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6)}
nav[hidden]{display:none}
nav button{background:none;border:0;color:var(--mute);padding:8px 2px 7px;border-radius:26px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .2s,color .2s}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--tab-on);background:var(--tab-bg);font-weight:700}

/* tepa qator: Telegram tugmalari orasidagi balans chiplari */
#top{position:sticky;top:0;z-index:6;margin:0 -16px;padding-top:var(--st,0px);padding-left:calc(16px + var(--sl,0px));padding-right:calc(16px + var(--sr,0px))}
#top[hidden]{display:none}
#top .in{height:var(--sh,52px);display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
#top .in::-webkit-scrollbar{display:none}
.tchip{flex:none;display:flex;align-items:center;gap:6px;padding:4px 4px 4px 9px;border-radius:999px;color:var(--ink);font-weight:700;font-size:14px;
  background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tchip .plus{width:24px;height:24px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;background:var(--gold);color:var(--gold-ink)}
.tchip .plus svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.cur{width:18px;height:18px;flex:none;vertical-align:-4px}
.brow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border:0}
.brow .cur{width:24px;height:24px}
.brow b{margin-left:auto}

.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:14px 0 12px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:9px 2px;border-radius:9px;font-size:14px}
.seg button[aria-selected="true"]{background:#3552E0;color:#fff;font-weight:600}

label{display:block;font-size:14px;color:var(--mute);margin:12px 0 5px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:11px;padding:12px}
.btn{width:100%;margin-top:14px;border:0;border-radius:12px;padding:14px;font-weight:700;background:var(--gold);color:var(--gold-ink)}
.btn.alt{background:#3552E0;color:#fff}
.btn:disabled{opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:999px;font-size:14px}
.chip[aria-pressed="true"]{background:#3552E0;color:#fff;border-color:#3552E0}
.copy{display:flex;gap:8px;align-items:center;background:var(--field);border:1px dashed var(--mute);border-radius:11px;padding:11px 12px;margin-top:8px;word-break:break-all}
.copy button{margin-left:auto;border:0;background:#3552E0;color:#fff;border-radius:8px;padding:7px 11px;flex:none}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nft{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.nft .ph{aspect-ratio:1;background:#0A0F25 center/contain no-repeat;display:grid;place-items:center;font-size:42px}
.nft .in{padding:10px}
.nft h3{margin:0 0 4px;font-size:15px}
.attr{font-size:12px;color:var(--mute);line-height:1.5}
.price{font-weight:700;margin:6px 0 8px}
.nft .btn{margin:0;padding:10px;font-size:14px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end}
.sheet{background:#101733;width:100%;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet .ph{width:100%;aspect-ratio:1;max-height:48vh;border-radius:14px;background:#0A0F25 center/contain no-repeat;margin-bottom:10px;overflow:hidden;display:grid;place-items:center;font-size:60px}
.ph img,.ph svg,.ph video{width:100%;height:100%;object-fit:contain;display:block}
.pay{display:grid;gap:8px;margin-top:12px}
.pay button{display:flex;justify-content:space-between;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
.pay button:disabled{opacity:.45}

#toast{position:fixed;left:16px;right:16px;bottom:calc(104px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;z-index:20;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#toast.err{background:var(--neg);color:#fff}
.spin{text-align:center;padding:40px;color:var(--mute)}

.cur{border-radius:50%;object-fit:cover}
.wallets{scroll-padding-left:16px;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 12px;padding:0 16px 4px;scrollbar-width:none}
.wallets::-webkit-scrollbar{display:none}
.wcard{position:relative;overflow:hidden;flex:none;width:158px;min-height:120px;scroll-snap-align:start;border-radius:20px;padding:12px;background:rgba(14,19,44,.9);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}
.wcard::before{content:"";position:absolute;inset:0;background:var(--img) var(--pos,center)/var(--fit,cover) no-repeat;opacity:var(--op,.24)}
.wcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,26,.1),rgba(7,11,26,.5))}
.wcard>*{position:relative;z-index:1}
.wcard .wh{display:flex;align-items:center;gap:9px}
.wcard .wh .cur{width:36px;height:36px;display:block;margin:0}
.wcard .wh .cards{height:34px;width:auto;object-fit:contain}
.wcard span{color:#D6DEFA;font-size:13px;font-weight:600}
.wcard b{display:block;font-size:23px;margin-top:12px;overflow:hidden;text-overflow:ellipsis}
.cur.sqr{border-radius:28%}
.qimg{width:26px;height:26px;border-radius:7px;object-fit:cover}
.cardsimg{height:62px;width:auto;display:block;margin:0 0 6px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.quick button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r);padding:12px 2px 10px;font-size:12px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:7px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.quick svg{width:26px;height:26px;fill:none;stroke:#9DB6FF;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ads{margin-bottom:12px}
.ads .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--r);scrollbar-width:none;border:1px solid var(--line)}
.ads .track::-webkit-scrollbar{display:none}
.ads .slide{flex:none;width:100%;scroll-snap-align:center;aspect-ratio:2.1/1;background:#0E1430 center/cover no-repeat;border:0;padding:0;display:block}
.ads .dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.ads .dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s,background .2s}
.ads .dots i.on{width:18px;background:#7FA2FF}
/* admin: tepa o'ng burchakdagi dumaloq stiker */
#top{display:flex;align-items:center}
#top .in{flex:1;min-width:0}
.sup{flex:none;width:42px;height:42px;padding:0;border:2px solid var(--glass-line);border-radius:50%;background:none;margin-left:8px;animation:floaty 3.2s ease-in-out infinite;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.sup[hidden]{display:none}
.sup svg{width:100%;height:100%;display:block;border-radius:50%}
/* ro'yxat uslubi: guruhlangan kartalar, rangli kvadrat ikonlar */
.gh{color:var(--mute);font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;margin:6px 10px 6px}
.grp{position:relative;overflow:hidden;background:rgba(30,38,68,.6);border:1px solid var(--line);border-radius:24px;margin:0 0 16px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.grp::after{content:"";position:absolute;right:-22px;bottom:-22px;width:130px;height:130px;border-radius:50%;background:url(/static/j.jpg) center/cover;opacity:.07;pointer-events:none}
.mrow{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;background:none;border:0;color:var(--ink);text-align:left;font-size:17px;z-index:1}
.mrow+.mrow::before{content:"";position:absolute;top:0;left:76px;right:0;height:1px;background:var(--line)}
button.mrow:active{background:rgba(255,255,255,.05)}
.mrow .t{flex:1;min-width:0}
.mrow .t small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .v{color:var(--mute);font-size:17px}
.chev{width:18px;height:18px;flex:none;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sq{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--a,#1a2350),var(--b,#0d1230));box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 4px 10px rgba(0,0,0,.28);overflow:hidden;font-size:26px}
.sq svg{width:27px;height:27px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sq img{width:100%;height:100%;object-fit:cover;display:block}
.sq.pad img{object-fit:contain;padding:5px}
.sq.thumb{background:#0A0F25}
/* to'ldirish usullari */
.tp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tp button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r);padding:12px 4px 10px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.tp button[aria-pressed="true"]{background:#3552E0;border-color:#3552E0;color:#fff}
.tp .cur{width:30px;height:30px}
.tp .mini{width:30px;height:30px;display:grid;place-items:center}
.tp .mini svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.head b{font-size:16px}
.brands{display:flex;gap:8px;margin:0 0 10px}
.brand{font-weight:800;letter-spacing:.6px;font-size:13px;padding:6px 12px;border-radius:8px;color:#fff}
.brand.humo{background:linear-gradient(135deg,#0E9F8E,#0A6E9A)}
.brand.uzcard{background:linear-gradient(135deg,#2B5BD7,#1B2E8F)}
.need{margin-top:10px;padding:10px 12px;border-radius:11px;background:rgba(245,176,0,.12);border:1px solid rgba(245,176,0,.35);font-size:15px}
.need b{color:var(--gold)}
.bigton{width:54px;height:54px;flex:none;animation:floaty 3s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(42,140,240,.6))}
.starA{position:relative;flex:none;width:58px;height:58px;display:grid;place-items:center;animation:floaty 3s ease-in-out infinite}
.starA img,.starA svg{width:100%;height:100%;filter:drop-shadow(0 0 12px rgba(255,170,0,.7));animation:pulse 2s ease-in-out infinite}
.starA i{position:absolute;width:11px;height:11px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);opacity:0;animation:tw 1.8s infinite}
.starA i:nth-of-type(1){top:-2px;right:2px}
.starA i:nth-of-type(2){bottom:4px;left:-4px;animation-delay:.6s;width:9px;height:9px}
.starA i:nth-of-type(3){top:14px;right:-6px;animation-delay:1.2s;width:8px;height:8px}
.wait{text-align:center;padding:26px 14px}
.ring{width:58px;height:58px;margin:0 auto 14px;border-radius:50%;border:5px solid rgba(127,162,255,.25);border-top-color:#7FA2FF;animation:spin 1s linear infinite}
.cancelled{color:var(--mute)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<linearGradient id="gj" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5CF0D2"/><stop offset="1" stop-color="#0E9C93"/></linearGradient>

<header id="top" hidden><div class="in" id="tb"></div><button id="sup" class="sup" type="button" hidden aria-label="Adminga murojaat"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="avbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FA2FF"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs><circle cx="32" cy="32" r="30" fill="url(#avbg)"/><path d="M14 58c2-12 10-17 18-17s16 5 18 17z" fill="#1B2E8F"/><rect x="28" y="36" width="8" height="8" rx="3" fill="#F2C9A5"/><ellipse cx="32" cy="27" rx="12" ry="13" fill="#F8D7B5"/><path d="M19.5 25c0-9 5-13.5 12.5-13.5S44.5 16 44.5 25c-3-4-7-6-12.5-6s-9.500 2-12.500 6z" fill="#2A1A3E"/><circle cx="27.500" cy="28" r="1.600" fill="#2A1A3E"/><circle cx="36.500" cy="28" r="1.600" fill="#2A1A3E"/><path d="M28 33.500c2.500 2.500 5.500 2.500 8 0" fill="none" stroke="#B8552F" stroke-width="1.600" stroke-linecap="round"/><path d="M18.500 27c0-10 5-16 13.500-16s13.500 6 13.500 16" fill="none" stroke="#F5B000" stroke-width="3" stroke-linecap="round"/><rect x="15.500" y="25" width="5" height="9" rx="2.500" fill="#F5B000"/><rect x="43.500" y="25" width="5" height="9" rx="2.500" fill="#F5B000"/><path d="M46 33c0 6-5 8-11 8.500" fill="none" stroke="#F5B000" stroke-width="2" stroke-linecap="round"/><circle cx="34" cy="41.500" r="2.400" fill="#F5B000"/></svg></button></header>
<div id="app"><div class="spin">Yuklanmoqda…</div></div>
<nav id="tabs" hidden role="tablist">
  <button data-t="home" role="tab"><svg viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2V19a1 1 0 0 1-1 1h-4.2v-5.2H9.2V20H5a1 1 0 0 1-1-1z" fill="currentColor" fill-opacity=".2"/></svg>Bosh</button>
  <button data-t="nft" role="tab"><svg viewBox="0 0 24 24"><path d="M7 4h10l4 5.5L12 20 3 9.5z" fill="currentColor" fill-opacity=".2"/><path d="M3 9.5h18M9.5 4 8 9.5 12 20M14.5 4 16 9.5 12 20"/></svg>NFT</button>
  <button data-t="wallet" role="tab"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3" fill="currentColor" fill-opacity=".2"/><path d="M16 6V5a2 2 0 0 0-2-2H6a3 3 0 0 0-3 3"/><circle cx="16.5" cy="13" r="1.2" fill="currentColor"/></svg>Hamyon</button>
  <button data-t="items" role="tab"><svg viewBox="0 0 24 24"><path d="M5.5 8h13l1 12h-15z" fill="currentColor" fill-opacity=".2"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8M9 12.5a3 3 0 0 0 6 0"/></svg>Buyumlar</button>
</nav>
<div id="toast" role="status"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
const INIT = tg ? tg.initData : "";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n).toLocaleString("ru-RU").replace(/ /g, " ");

const S = { me: null, tab: "home", seg: "topup", nfts: [], items: [], hist: [], busy: false,
            wd: "card", tp: "card", pend: null, tonAmt: "", cv: ["UZS", "J"], uc: null, fatal: null, banners: [], adIdx: 0 };
const CUR = {UZS: "So'm", J: "J", STARS: "Stars", TON: "TON"};
const LOGO = "/static/j.jpg";
const ICO = { j: "/static/j.jpg", stars: "/static/stars.svg", ton: "/static/ton.svg", uc: "/static/pubg.jpg" };
const ic = n => ICO[n] ? `<img class="cur ${n === "j" ? "" : "sqr"}" alt="${n}" src="${ICO[n]}">` : `<svg class="cur" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const short = n => n >= 100000 ? (n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : Math.round(n / 1000) + "K") : fmt(n);
function insets() {
  const r = document.documentElement.style;
  const st = (tg && tg.safeAreaInset && tg.safeAreaInset.top) || 0, ct = (tg && tg.contentSafeAreaInset && tg.contentSafeAreaInset.top) || 0;
  const full = !!(tg && tg.isFullscreen) || st + ct > 0;   // Telegram tugmalari (Yopish, ⋮) ustida turgan holat
  r.setProperty("--st", full ? st + "px" : "0px");
  r.setProperty("--sh", (full ? Math.max(ct, 44) : 52) + "px");
  r.setProperty("--sl", full ? "92px" : "0px");
  r.setProperty("--sr", full ? "80px" : "0px");
}
if (tg) { insets(); ["safeAreaChanged", "contentSafeAreaChanged", "fullscreenChanged"].forEach(e => { try { tg.onEvent(e, insets); } catch (x) {} }); }
function topBar() {
  const b = S.me.bal, z = S.me.frozen;
  const chip = (k, icon, val, go) => `<div class="tchip">${ic(icon)}<span class="num">${val}</span><button class="plus" data-go="${go}" aria-label="${k} qo'shish"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>`;
  $("#tb").innerHTML = chip("J", "j", short(b.j), "j") + chip("So'm", "uzs", short(b.uzs), "uzs") + chip("Stars", "stars", short(b.stars), "stars");
  $("#top").hidden = false;
  const sp = $("#sup"); sp.hidden = !S.me.support;
  sp.onclick = () => { const u = "https://t.me/" + S.me.support; try { if (tg && tg.openTelegramLink) tg.openTelegramLink(u); else window.open(u, "_blank"); } catch (e) { window.open(u, "_blank"); } };
  document.querySelectorAll("[data-go]").forEach(x => x.onclick = () => {
    const g = x.dataset.go; S.tab = "wallet";
    if (g === "uzs") S.seg = "topup"; else { S.seg = "cv"; S.cv = ["UZS", g === "j" ? "J" : "STARS"]; }
    window.scrollTo(0, 0); render();
  });
}

async function api(path, opts = {}) {
  const h = Object.assign({ "X-Init-Data": INIT }, opts.headers || {});
  let body = opts.body;
  if (body && !(body instanceof FormData)) { h["Content-Type"] = "application/json"; body = JSON.stringify(body); }
  let r;
  try { r = await fetch(path, { method: opts.method || "GET", headers: h, body }); }
  catch (e) { throw new Error("Internet aloqasi yo'q. Qayta urinib ko'ring"); }
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && typeof j.detail === "string") ? j.detail : (r.status === 422 ? "Ma'lumot noto'g'ri kiritildi" : "Server javob bermadi, birozdan so'ng urinib ko'ring"));
  return j;
}
let tt;
function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.className = "show" + (err ? " err" : "");
  clearTimeout(tt); tt = setTimeout(() => t.className = "", 3600);
  try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(err ? "error" : "success"); } catch (e) {}
}

async function refresh(all) {
  try {
    S.me = await api("/api/me"); S.fatal = null;
    if (all || S.tab === "home") S.hist = await api("/api/history");
    if (all || S.tab === "home") { try { S.banners = await api("/api/banners"); } catch (e) {} }
    if (all || S.tab === "nft") S.nfts = await api("/api/nfts");
    if (all || S.tab === "items") S.items = await api("/api/items");
  } catch (e) { if (!S.me) S.fatal = e.message; else if (all) toast(e.message, true); }
  if (!S.busy && !typing() && !$(".sheet-bg")) render();
}
function typing() { const a = document.activeElement; return a && ["INPUT", "SELECT"].includes(a.tagName); }

function render() {
  const app = $("#app");
  if (S.fatal) { $("#tabs").hidden = true; $("#top").hidden = true; app.innerHTML = `<div class="empty"><p>${esc(S.fatal)}</p><button class="btn alt" id="retry">Qayta urinish</button></div>`; $("#retry").onclick = () => refresh(true); return; }
  if (!S.me) return;
  $("#tabs").hidden = false; topBar();
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.t === S.tab));
  const view = { home: vHome, nft: vNft, wallet: vWallet, items: vItems }[S.tab]();
  app.innerHTML = hero() + view;
  initLottie(app);
  bind();
}

function hero() {
  return `<section class="hero"><small>Umumiy balans</small>
    <div class="big num" style="margin-bottom:2px">${fmt(S.me.total_uzs)}<span>so'm</span></div></section>`
    + (S.me.frozen ? `<div class="banner" style="margin-bottom:12px">🔒 Hisobingiz muzlatilgan. Botda «Shartnoma → Hisobni muzlatish» bo'limida parol bilan oching.</div>` : "");
}

function adsHtml() {
  if (!S.banners.length) return "";
  return `<div class="ads"><div class="track" id="adtrack">${S.banners.map(b => `<button class="slide" data-ad="${esc(b.url)}" style="background-image:url('/banner/${b.id}')" aria-label="Reklama"></button>`).join("")}</div>
    ${S.banners.length > 1 ? `<div class="dots" id="addots">${S.banners.map((b, i) => `<i class="${i === S.adIdx ? "on" : ""}"></i>`).join("")}</div>` : ""}</div>`;
}
let adTimer;
function initAds() {
  clearInterval(adTimer);
  const tr = $("#adtrack"); if (!tr) return;
  const n = S.banners.length, w = () => tr.clientWidth;
  if (S.adIdx >= n) S.adIdx = 0;
  tr.scrollLeft = S.adIdx * w();
  const dots = () => document.querySelectorAll("#addots i").forEach((d, i) => d.classList.toggle("on", i === S.adIdx));
  tr.onscroll = () => { const i = Math.round(tr.scrollLeft / (w() || 1)); if (i !== S.adIdx) { S.adIdx = i; dots(); } };
  tr.querySelectorAll("[data-ad]").forEach(b => b.onclick = () => {
    const u = b.dataset.ad; if (!u) return;
    try { if (tg && /^https:\/\/t\.me\//.test(u) && tg.openTelegramLink) tg.openTelegramLink(u); else if (tg && tg.openLink) tg.openLink(u); else window.open(u, "_blank"); } catch (e) { window.open(u, "_blank"); }
  });
  if (n > 1) adTimer = setInterval(() => { if (document.hidden) return; S.adIdx = (S.adIdx + 1) % n; tr.scrollTo({ left: S.adIdx * w(), behavior: "smooth" }); dots(); }, 4500);
}

function vHome() {
  const b = S.me.bal, f = S.me.friends;
  const hist = S.hist.length ? S.hist.map(t => `<div class="row"><div>${esc(t.label)}<div class="mute">${esc(t.t)}</div></div>
      <b class="num ${t.cancel ? "cancelled" : t.pos ? "pos" : "neg"}">${t.cancel ? "✖ " : t.pos ? "+" : "−"}${esc(t.amount)} ${esc(t.cur)}</b></div>`).join("")
    : `<div class="empty">Hozircha amal yo'q. «Hamyon» bo'limidan hisobni to'ldiring.</div>`;
  const wc = (icon, name, v, bg, fit, op) => `<div class="wcard" style="--img:url('${bg}');--fit:${fit || "cover"};--op:${op || .24};--pos:${fit ? "right -18px bottom -18px" : "center"}"><div class="wh">${icon === "uzs" ? `<img class="cards" alt="Humo, Uzcard" src="/static/cards.webp">` : ic(icon)}<span>${name}</span></div><b class="num">${v}</b></div>`;
  const qk = (go, label, path) => `<button data-q="${go}"><svg viewBox="0 0 24 24">${path}</svg>${label}</button>`;
  return `<div class="wallets">${wc("j", "J", fmt(b.j), "/static/j.jpg")}${wc("stars", "Stars", fmt(b.stars), "/static/stars.svg", "104px", .17)}${wc("uzs", "So'm", fmt(b.uzs), "/static/cards.webp", "128px", .38)}${wc("ton", "TON", esc(b.ton), "/static/ton.svg", "104px", .17)}${wc("uc", "PUBG UC", fmt(b.uc), "/static/pubg.jpg")}</div>
    <div class="quick">
      ${qk("topup", "To'ldirish", '<path d="M12 5v14M5 12h14"/>')}
      ${qk("wd", "Yechish", '<path d="M12 19V5M6 11l6-6 6 6"/>')}
      ${qk("cv", "Almashtirish", '<path d="M7 7h12l-3-3M17 17H5l3 3"/>')}
      <button data-q="uc"><img class="qimg" alt="" src="/static/pubg.jpg">UC</button>
    </div>
    ${adsHtml()}
    <h2>Do'stlarni taklif qiling</h2>
    <div class="card"><div class="mute">Taklif qilinganlar: <b>${f.count}</b></div>
      <div class="copy"><span>${esc(f.link)}</span><button id="cp" data-v="${esc(f.link)}">Nusxa</button></div></div>
    <h2>So'nggi amallar</h2><div class="card hist">${hist}</div>`;
}

function mbox(n, full) {
  if (!n.photo) return `<div class="ph">🎁</div>`;
  if (!full && n.kind !== "image")   // ro'yxatda animatsiya o'ynamaydi (telefon qotmasligi uchun): yengil statik rasm
    return `<div class="ph"><img loading="lazy" decoding="async" alt="" src="/thumb/${n.id}" onerror="this.parentNode.textContent='🎁'"></div>`;
  if (n.kind === "lottie") return `<div class="ph" data-lot="/media/${n.id}"></div>`;
  if (n.kind === "video") return `<div class="ph"><video src="/media/${n.id}" autoplay loop muted playsinline></video></div>`;
  return `<div class="ph" style="background-image:url('/media/${n.id}')"></div>`;
}
function initLottie(root) {
  root.querySelectorAll("[data-lot]").forEach(el => {
    if (el.dataset.done || !window.lottie) return; el.dataset.done = 1;
    try { lottie.loadAnimation({ container: el, renderer: "svg", loop: true, autoplay: true, path: el.dataset.lot }); } catch (e) {}
  });
}
function attrs(n) {
  return [["Model", n.model, n.model_pct], ["Orqa fon", n.backdrop, n.backdrop_pct], ["Belgi", n.symbol, n.symbol_pct]]
    .filter(a => a[1]).map(a => `${a[0]}: ${esc(a[1])}${a[2] ? " " + esc(String(a[2]).replace(/%+$/, "")) + "%" : ""}`).join("<br>");
}
function vNft() {
  if (!S.nfts.length) return `<div class="empty">Hozir sotuvda NFT yo'q. Tez orada yangilari qo'shiladi.</div>`;
  return `<h2>Sotuvdagi NFT</h2><div class="grid">` + S.nfts.map(n => `
    <div class="nft">${mbox(n)}
    <div class="in"><h3>${esc(n.title)}</h3><div class="attr">${attrs(n)}</div>
    <div class="price num">${fmt(n.price_uzs)} so'm</div>
    <div class="attr num" style="margin:-4px 0 8px">${fmt(n.price_j)} J · ${n.price_ton} TON</div>
    <button class="btn alt" data-buy="${n.id}">Sotib olish</button></div></div>`).join("") + `</div>`;
}
function vItems() {
  const head = `<div class="grp"><div class="mrow">${sq("gift", "#C084FC", "#8B3DE8")}<span class="t">Inventar</span><span class="v num">${S.items.length}</span></div>
    <button type="button" class="mrow" data-hist>${sq("clock", "#FFB020", "#FF7A00")}<span class="t">Amallar tarixi</span>${CHEV}</button></div>`;
  if (!S.items.length) return head + `<div class="empty">Hali buyumingiz yo'q. «NFT» bo'limidan xarid qiling.</div>`;
  const th = i => i.nft_id && i.photo ? `<img loading="lazy" decoding="async" alt="" src="/thumb/${i.nft_id}" onerror="this.replaceWith(document.createTextNode('🎁'))">` : "🎁";
  return head + `<div class="gh">Mening buyumlarim</div><div class="grp">` + S.items.map(i => `<button type="button" class="mrow" data-item="${i.id}"><span class="sq thumb">${th(i)}</span><span class="t">${esc(i.title)}<small>${esc(i.paid)} · ${esc(i.date)}</small></span>${CHEV}</button>`).join("") + `</div>`;
}
function openItem(id) {
  const i = S.items.find(x => x.id === id); if (!i) return;
  const { bg } = sheet(`${mbox({ id: i.nft_id, photo: !!(i.photo && i.nft_id), kind: i.kind }, true)}
    <h3 style="margin:0 0 4px">${esc(i.title)}</h3><div class="attr">${i.lines.map(esc).join("<br>")}</div>
    <div class="mute" style="margin:8px 0">To'langan: ${esc(i.paid)} · ${esc(i.date)}</div>${CLOSE_BTN}`);
  initLottie(bg);
}
async function openHist() {
  let h = []; try { h = await api("/api/history"); } catch (e) { return toast(e.message, true); }
  const rows = h.length ? h.map(t => `<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><div>${esc(t.label)}<div class="mute">${esc(t.t)}</div></div>
    <b class="num ${t.cancel ? "cancelled" : t.pos ? "pos" : "neg"}">${t.cancel ? "✖ " : t.pos ? "+" : "−"}${esc(t.amount)} ${esc(t.cur)}</b></div>`).join("") : `<div class="empty">Hozircha amal yo'q.</div>`;
  sheet(`<h3 style="margin:0 0 6px">Amallar tarixi</h3>${rows}${CLOSE_BTN}`);
}

function vWallet() {
  const seg = [["topup", "To'ldirish"], ["wd", "Yechish"], ["cv", "Almashtirish"], ["uc", "UC"]];
  const head = `<div class="seg" role="tablist">${seg.map(s => `<button role="tab" data-seg="${s[0]}" aria-selected="${S.seg === s[0]}">${s[1]}</button>`).join("")}</div>`;
  return head + ({ topup: wTopup, wd: wWd, cv: wCv, uc: wUc }[S.seg])();
}
function starIcon() { return `<span class="starA"><img src="/static/stars.svg" alt=""><i></i><i></i><i></i></span>`; }
function wTopup() {
  const tile = (k, icon, name) => `<button type="button" data-tp="${k}" aria-pressed="${S.tp === k}">${icon}${name}</button>`;
  const card = `<span class="mini"><svg viewBox="0 0 24 24"><rect x="2.500" y="5" width="19" height="14" rx="3"/><path d="M2.500 10h19M6.500 15h4"/></svg></span>`;
  return `<div class="tp">${tile("stars", ic("stars"), "Stars")}${tile("ton", ic("ton"), "TON")}${tile("card", card, "Karta")}</div>`
    + ({ stars: tpStars, ton: tpTon, card: tpCard }[S.tp])();
}
function tpCard() {
  const t = S.me.topup;
  return `<div class="card"><img class="cardsimg" alt="Humo, Uzcard" src="/static/cards.webp"><b>Kartaga o'tkazing</b>
    <div class="copy"><span class="num">${esc(t.card || "Karta hali kiritilmagan")}</span>${t.card ? `<button type="button" data-v="${esc(t.card)}">Nusxa</button>` : ""}</div>
    <div class="mute" style="margin-top:6px">Qabul qiluvchi: ${esc(t.owner || "—")}<br>Minimal: ${fmt(t.min)} so'm · Komissiya: ${t.fee}%</div></div>
    <form id="f-topup" class="card"><label for="a">O'tkazgan summangiz (so'm)</label>
    <input id="a" inputmode="numeric" placeholder="${fmt(t.min)}" required>
    <label for="f">Chek (rasm yoki fayl)</label><input id="f" type="file" accept="image/*,application/pdf" required>
    <button class="btn">Chekni yuborish</button></form>`;
}
function tpStars() {
  return `<form id="f-stars" class="card"><div class="head">${starIcon()}<div><b>Stars bilan to'ldirish</b><div class="mute">Komissiyasiz (0%)</div></div></div>
    <div class="chips" style="margin-top:10px">${[50, 100, 250, 500, 1000].map(x => `<button type="button" class="chip" data-sa="${x}">${x} ⭐</button>`).join("")}</div>
    <label for="a">Stars miqdori</label><input id="a" inputmode="numeric" placeholder="100" required>
    <button class="btn">⭐ To'ldirish</button></form>`;
}
function tpTon() {
  const t = S.me.topup;
  if (S.pend) return `<div class="card wait"><div class="ring" role="progressbar" aria-label="Kutilmoqda"></div><b>Tasdiqlanishi kutilmoqda…</b>
    <div class="mute" style="margin-top:6px">${esc(S.pend.amount)} TON · so'rov #${S.pend.id}<br>Admin tasdiqlagach balansingizga tushadi.</div></div>`;
  return `<form id="f-ton" class="card"><div class="head"><svg class="bigton" aria-hidden="true"><use href="#i-ton"/></svg><div><b>TON bilan to'ldirish</b><div class="mute">Pastdagi manzilga yuboring</div></div></div>
    <label for="a">Miqdor (TON)</label><input id="a" inputmode="decimal" placeholder="1" value="${esc(S.tonAmt)}" required>
    <label>TON manzil</label><div class="copy"><span class="num" style="font-size:13px">${esc(t.ton_wallet)}</span><button type="button" data-v="${esc(t.ton_wallet)}">Nusxa</button></div>
    <div class="need" id="need"></div>
    <label>Izoh (MEMO) — albatta yozing</label><div class="copy"><span class="num">${esc(t.ton_memo)}</span><button type="button" data-v="${esc(t.ton_memo)}">Nusxa</button></div>
    <button class="btn">To'ldirish</button>
    <div class="mute" style="margin-top:8px">Yuborib bo'lgach «To'ldirish» ni bosing. Admin tekshirib tasdiqlaydi.</div></form>`;
}
function needTon() {
  const a = $("#a"), n = $("#need"); if (!a || !n) return;
  S.tonAmt = a.value;
  const v = parseFloat(a.value.replace(",", ".")), r = S.me.rates.ton_uzs;
  n.innerHTML = v > 0 ? `Yuborishingiz kerak: <b>${esc(String(+v.toFixed(4)))} TON</b>${r ? ` <span class="mute">≈ ${fmt(Math.round(v * r))} so'm</span>` : ""}` : `Yuboriladigan miqdorni kiriting`;
}
async function pollPend() {
  if (!S.pend || S.busy) return;
  try {
    const r = await api("/api/req/" + S.pend.id);
    if (r.status === "pending") return;
    const ok = r.status === "approved"; S.pend = null;
    try { localStorage.removeItem("pend"); } catch (e) {}
    toast(ok ? "✅ Hisobingiz TON bilan to'ldirildi" : "❌ To'ldirish bekor qilindi", !ok);
    await refresh(true);
  } catch (e) {}
}
const G = {
  card: '<rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h3"/>',
  phone: '<rect x="7" y="2.8" width="10" height="18.4" rx="2.6"/><path d="M11 18h2"/>',
  gift: '<rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M12 8v12.5M19 12v7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19v-7M7.8 8a2.4 2.4 0 1 1 0-4.8C11 3.2 12 8 12 8s1-4.8 4.2-4.8a2.4 2.4 0 1 1 0 4.8"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'
};
const sq = (k, a, b) => `<span class="sq" style="--a:${a};--b:${b}"><svg viewBox="0 0 24 24" aria-hidden="true">${G[k]}</svg></span>`;
const sqi = (src, cls = "") => `<span class="sq ${cls}"><img alt="" src="${src}"></span>`;
const CHEV = `<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>`;
function wdIcon(k) {
  if (k === "stars") return sqi("/static/stars.svg");
  if (k === "uc") return sqi("/static/pubg.jpg");
  const d = { card: ["card", "#35A7FF", "#1769E8"], phone: ["phone", "#3DDC97", "#0E9F6E"], nft: ["gift", "#C084FC", "#8B3DE8"] }[k] || ["card", "#35A7FF", "#1769E8"];
  return sq(d[0], d[1], d[2]);
}
function wWd() {
  const w = S.me.withdraw, b = S.me.bal;
  const bal = (icon, name, val) => `<div class="mrow">${icon}<span class="t">${name}</span><span class="v num">${val}</span></div>`;
  const row = k => { const m = w[k]; if (!m) return ""; return `<button type="button" class="mrow" data-wd="${k}">${wdIcon(k)}<span class="t">${esc(m.label)}<small>Minimal: ${fmt(m.min)} ${esc(m.cur === "UZS" ? "so'm" : m.cur)}${m.fee ? ` · komissiya ${m.fee}%` : ""}</small></span>${CHEV}</button>`; };
  return `<div class="gh">Balanslar</div><div class="grp">${bal(sqi("/static/j.jpg"), "J", fmt(b.j))}${bal(sqi("/static/cards.webp", "pad"), "So'm", fmt(b.uzs))}${bal(sqi("/static/stars.svg"), "Stars", fmt(b.stars))}${bal(sqi("/static/ton.svg"), "TON", esc(b.ton))}${bal(sqi("/static/pubg.jpg"), "PUBG UC", fmt(b.uc))}</div>
    <div class="gh">Yechib olish usuli</div>
    <div class="grp">${["card", "phone"].map(row).join("")}</div><div class="grp">${["stars", "uc", "nft"].map(row).join("")}</div>`;
}
function sheet(html, tag) {
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<${tag || "div"} class="sheet" role="dialog">${html}</${tag || "div"}>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.onclick = e => { if (e.target === bg) close(); };
  const x = $("#x", bg); if (x) x.onclick = close;
  return { bg, close };
}
const CLOSE_BTN = `<button type="button" class="btn" id="x" style="background:var(--field);color:var(--ink)">Yopish</button>`;
function openWd(k) {
  const m = S.me.withdraw[k]; if (!m) return;
  const cur = m.cur === "UZS" ? "so'm" : m.cur;
  const { bg, close } = sheet(`<div class="head">${wdIcon(k)}<div><b>${esc(m.label)} orqali yechish</b><div class="mute">Admin tasdiqlagach bajariladi</div></div></div>
    <label for="wa">Miqdor (${esc(cur)})</label><input id="wa" inputmode="numeric" placeholder="${m.min ? fmt(m.min) : "Miqdor"}" required>
    <label for="wd">${esc(m.ask)}</label><input id="wd" maxlength="200" required>
    <div class="mute" style="margin-top:8px">Minimal: ${fmt(m.min)} ${esc(cur)}${m.fee ? ` · Komissiya: ${m.fee}%` : ""}</div>
    <button class="btn">So'rov yuborish</button>${CLOSE_BTN}`, "form");
  const f = $(".sheet", bg);
  f.onsubmit = async e => {
    e.preventDefault(); if (S.busy) return;
    S.busy = true; const btn = f.querySelector(".btn"); btn.disabled = true;
    try {
      const r = await api("/api/withdraw", { method: "POST", body: { method: k, amount: $("#wa", bg).value, details: $("#wd", bg).value } });
      close(); toast(r.msg); S.busy = false; await refresh(true);
    } catch (er) { S.busy = false; btn.disabled = false; toast(er.message, true); }
  };
}
function wCv() {
  const [a, b] = S.cv, bal = S.me.bal, key = c => ({UZS: "uzs", J: "j", STARS: "stars", TON: "ton"}[c]);
  const opt = sel => Object.keys(CUR).map(c => `<option value="${c}" ${c === sel ? "selected" : ""}>${CUR[c]}</option>`).join("");
  return `<form id="f-cv" class="card"><label for="ca">Beraman</label><select id="ca">${opt(a)}</select>
    <div class="mute" style="margin-top:5px">Balans: ${a === "TON" ? esc(bal.ton) : fmt(bal[key(a)])}</div>
    <label for="cb">Olaman</label><select id="cb">${opt(b)}</select>
    <label for="a">Miqdor</label><input id="a" inputmode="decimal" required>
    <div class="mute" id="prev" style="margin-top:8px"></div>
    <button class="btn">Almashtirish</button></form>`;
}
function wUc() {
  const p = S.me.uc_packs;
  return `<form id="f-uc" class="card"><div class="head"><img class="qimg" style="width:52px;height:52px;border-radius:14px" alt="PUBG Mobile" src="/static/pubg.jpg"><div><b>PUBG Mobile UC</b><div class="mute">Paketni tanlang</div></div></div>
    <div class="chips" style="margin-top:10px">${p.map(x => `<button type="button" class="chip" data-uc="${x.qty}" aria-pressed="${S.uc === x.qty}">${x.qty} UC · ${fmt(x.price)}</button>`).join("")}</div>
    <label for="pid">PUBG ID (6–12 raqam)</label><input id="pid" inputmode="numeric" maxlength="12" required>
    <div class="mute" style="margin-top:8px">To'lov so'm balansingizdan olinadi.</div>
    <button class="btn">Buyurtma berish</button></form>`;
}

function bind() {
  const app = $("#app");
  app.querySelectorAll("[data-v]").forEach(cp => cp.onclick = () => { const v = cp.dataset.v; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast("Nusxalandi"), () => toast("Nusxalab bo'lmadi, qo'lda belgilang", true)); });
  app.querySelectorAll("[data-tp]").forEach(b => b.onclick = () => { S.tp = b.dataset.tp; render(); });
  app.querySelectorAll("[data-sa]").forEach(b => b.onclick = () => { $("#a").value = b.dataset.sa; });
  app.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { S.tab = "wallet"; S.seg = b.dataset.q; window.scrollTo(0, 0); render(); });
  initAds();
  app.querySelectorAll("[data-seg]").forEach(b => b.onclick = () => { S.seg = b.dataset.seg; render(); });
  app.querySelectorAll("[data-wd]").forEach(b => b.onclick = () => openWd(b.dataset.wd));
  app.querySelectorAll("[data-item]").forEach(b => b.onclick = () => openItem(+b.dataset.item));
  app.querySelectorAll("[data-hist]").forEach(b => b.onclick = openHist);
  app.querySelectorAll("[data-uc]").forEach(b => b.onclick = () => { S.uc = +b.dataset.uc; app.querySelectorAll("[data-uc]").forEach(x => x.setAttribute("aria-pressed", +x.dataset.uc === S.uc)); });
  app.querySelectorAll("[data-buy]").forEach(b => b.onclick = () => openBuy(+b.dataset.buy));
  const run = (id, fn) => {
    const f = $(id); if (!f) return;
    f.onsubmit = async e => {
      e.preventDefault(); if (S.busy) return;
      S.busy = true; const btn = f.querySelector(".btn"); btn.disabled = true;
      try { const r = await fn(); toast(r.msg); S.busy = false; await refresh(true); }
      catch (er) { S.busy = false; btn.disabled = false; toast(er.message, true); }
    };
  };
  run("#f-topup", () => { const fd = new FormData(); fd.append("amount", $("#a").value.replace(/\D/g, "")); fd.append("file", $("#f").files[0]); return api("/api/receipt", { method: "POST", body: fd }); });
  run("#f-stars", async () => {
    const n = parseInt($("#a").value.replace(/\D/g, ""), 10);
    if (!(n > 0)) throw new Error("Stars miqdorini kiriting");
    if (!(tg && tg.openInvoice)) throw new Error("Stars bilan to'lash uchun Mini App'ni Telegram ichidan oching");
    const r = await api("/api/topup/stars", { method: "POST", body: { amount: n } });
    return new Promise(res => tg.openInvoice(r.url, st => { setTimeout(refresh, 2500, true); res({ msg: st === "paid" ? "✅ To'lov qabul qilindi, Stars hisobingizga qo'shiladi" : "To'lov bekor qilindi" }); }));
  });
  const ft = $("#f-ton");
  if (ft) {
    needTon(); $("#a").oninput = needTon;
    ft.onsubmit = async e => {
      e.preventDefault(); if (S.busy) return;
      S.busy = true; const btn = ft.querySelector(".btn"); btn.disabled = true;
      try {
        const amount = $("#a").value;
        const r = await api("/api/topup/ton", { method: "POST", body: { amount } });
        S.pend = { id: r.id, amount: String(+parseFloat(amount.replace(",", ".")).toFixed(4)) }; S.tonAmt = "";
        try { localStorage.setItem("pend", JSON.stringify(S.pend)); } catch (x) {}
        S.busy = false; toast(r.msg); render();
      } catch (er) { S.busy = false; btn.disabled = false; toast(er.message, true); }
    };
  }

  run("#f-cv", () => api("/api/convert", { method: "POST", body: { a: $("#ca").value, b: $("#cb").value, amount: $("#a").value } }));
  run("#f-uc", () => { if (!S.uc) return Promise.reject(new Error("Avval UC paketini tanlang")); return api("/api/uc", { method: "POST", body: { qty: S.uc, pid: $("#pid").value } }); });
  const ca = $("#ca"), cb = $("#cb");
  if (ca) {
    const upd = () => { S.cv = [ca.value, cb.value]; if (ca.value === cb.value) { S.cv[1] = ca.value === "UZS" ? "J" : "UZS"; } };
    ca.onchange = cb.onchange = () => { upd(); render(); };
    $("#a").oninput = preview; preview();
  }
}
function preview() {
  const a = $("#a"), p = $("#prev"); if (!a || !p) return;
  const v = parseFloat(a.value.replace(",", ".")), r = S.me.rates;
  const rate = c => ({UZS: 1, J: r.j_uzs, STARS: r.stars_uzs, TON: r.ton_uzs}[c]);
  const [x, y] = S.cv;
  if (!(v > 0) || !rate(x) || !rate(y)) { p.textContent = ""; return; }
  const o = v * rate(x) / rate(y);
  p.textContent = "Olasiz: ≈ " + (y === "TON" ? o.toFixed(4) : fmt(Math.floor(o))) + " " + CUR[y];
}

function openBuy(id) {
  const n = S.nfts.find(x => x.id === id); if (!n) return;
  const b = S.me.bal, bg = document.createElement("div"); bg.className = "sheet-bg";
  const opts = [["uzs", `${fmt(n.price_uzs)} so'm`, b.uzs >= n.price_uzs], ["j", `${fmt(n.price_j)} ${ic('j')}`, n.price_j > 0 && b.j >= n.price_j], ["ton", `${n.price_ton} ${ic('ton')}`, n.price_ton > 0 && parseFloat(b.ton) >= n.price_ton], ["stars", `${fmt(n.price_stars)} ${ic('stars')}`, n.price_stars > 0 && b.stars >= n.price_stars]];
  bg.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(n.title)}">${mbox(n, true)}
    <h3 style="margin:0 0 4px">${esc(n.title)}</h3><div class="attr">${attrs(n)}</div>
    <div class="pay">${opts.filter(o => !/^0(\.0+)? /.test(o[1])).map(o => `<button data-c="${o[0]}" ${o[2] ? "" : "disabled"}><span>${o[1]}</span><span>${o[2] ? "To'lash" : "Balans yetmaydi"}</span></button>`).join("")}</div>
    <button class="btn" id="x" style="background:var(--field);color:var(--ink)">Yopish</button></div>`;
  document.body.appendChild(bg);
  initLottie(bg);
  const close = () => bg.remove();
  bg.onclick = e => { if (e.target === bg) close(); };
  $("#x", bg).onclick = close;
  bg.querySelectorAll("[data-c]").forEach(btn => btn.onclick = async () => {
    bg.querySelectorAll("button").forEach(x => x.disabled = true);
    try { const r = await api("/api/nft/buy", { method: "POST", body: { nft_id: id, cur: btn.dataset.c } }); close(); toast(r.msg); S.tab = "items"; await refresh(true); }
    catch (e) { close(); toast(e.message, true); refresh(true); }
  });
}

document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.t; window.scrollTo(0, 0); render(); refresh(false); });

// botdagi o'zgarishlar bilan bir xil bo'lishi uchun har 15 soniyada yangilanadi
setInterval(() => { if (!document.hidden && !S.busy) refresh(false); }, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); });
setInterval(pollPend, 4000);
try { const p = JSON.parse(localStorage.getItem("pend") || "null"); if (p && p.id) S.pend = p; } catch (e) {}
refresh(true);
</script>
</body>
</html>
